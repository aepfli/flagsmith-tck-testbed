services:
  flagsmith:
    image: ${IMAGE:-flagsmith-testbed}:${VERSION:-dev}
    build:
      context: .
    # Dynamically mapped, never pinned: the TCK reads the mapped port from the container. Pinning
    # would make parallel runs collide, and POST /stop deliberately never restarts the container
    # precisely so these mappings survive an outage.
    ports:
      - 8000
      - 8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
