name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests build but do not push: a fork PR has no write token, and a testbed image
      # tagged from an unreviewed branch is exactly the sort of thing an adoption would then pull
      # in CI without noticing.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building is not evidence that the testbed works. An image that starts and then serves
      # FLAG_NOT_FOUND for the whole canonical set would pass a build-only job and fail every
      # adoption downstream, which reads as a broken provider rather than a broken image.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker build -t testbed:smoke .
          docker run -d --name smoke -P testbed:smoke
          trap 'docker logs smoke || true; docker rm -f smoke || true' EXIT

          PROXY=$(docker port smoke 8000/tcp | head -1)
          CONTROL=$(docker port smoke 8080/tcp | head -1)
          KEY="ser.provider-tck-server-key"

          # /healthz reports the readiness of the CONTROL API, not of the backend -- the control
          # API deliberately stays up while the backend is down, otherwise an outage scenario
          # could never be ended. So waiting on it says nothing about whether flags are being
          # served, and evaluating straight afterwards is a race. (This is the flagd#2047 shape,
          # and this job failed on exactly it before the /start call below was added.)
          #
          # POST /start is the endpoint that carries the guarantee: it must not return until the
          # seeded flag state is actually being served. Use it, and in doing so test it.
          for i in $(seq 1 60); do
            if curl -sf "http://$CONTROL/healthz" >/dev/null; then break; fi
            sleep 1
          done
          curl -sf -X POST "http://$CONTROL/start?config=default" >/dev/null

          echo "::group::canonical flag set"
          curl -sf -H "X-Environment-Key: $KEY" "http://$PROXY/api/v1/flags/" | jq -S '.'
          echo "::endgroup::"

          # Every canonical key must resolve, and missing-flag must not exist -- the absence is
          # what the FLAG_NOT_FOUND scenario rests on.
          #
          # The key list is DERIVED from the canonical set, never hardcoded. It was hardcoded once,
          # and when the spec added targeting-key-flag this job kept passing while the image served
          # a set one flag short of the canonical one -- the exact drift the check exists to catch.
          keys=$(jq -r '.flags | keys[]' flags/canonical-flags.json)
          echo "checking $(echo "$keys" | wc -l) canonical keys"
          for key in $keys; do
            curl -sf -H "X-Environment-Key: $KEY" \
              "http://$PROXY/api/v1/flags/?feature=$key" >/dev/null \
              || { echo "::error::$key did not resolve"; exit 1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Environment-Key: $KEY" \
            "http://$PROXY/api/v1/flags/?feature=missing-flag")
          [ "$code" = "404" ] || { echo "::error::missing-flag returned $code, want 404"; exit 1; }

          # Falsy values are values, not absences.
          [ "$(curl -sf -H "X-Environment-Key: $KEY" \
              "http://$PROXY/api/v1/flags/?feature=integer-zero-flag" | jq -r '.feature_state_value')" = "0" ] \
            || { echo "::error::integer-zero-flag is not 0"; exit 1; }

          # 2^53-1 must survive the round trip exactly.
          [ "$(curl -sf -H "X-Environment-Key: $KEY" \
              "http://$PROXY/api/v1/flags/?feature=huge-integer-flag" | jq -r '.feature_state_value')" = "9007199254740991" ] \
            || { echo "::error::huge-integer-flag lost precision"; exit 1; }

          # Targeting, seeded as a Flagsmith identity override. All three directions, because a
          # backend that always served the targeted value would pass the matching case alone.
          tkf() {
            curl -sf -H "X-Environment-Key: $KEY" "$1" \
              | jq -r '(if type=="object" then .flags else . end)
                       | map(select(.feature.name=="targeting-key-flag"))[0].feature_state_value'
          }
          hit_id="5c3d8535-f81a-4478-a6d3-afaa4d51199e"
          miss_id="f20bd32d-703b-48b6-bc8e-79d53c85134a"
          [ "$(tkf "http://$PROXY/api/v1/flags/")" = "miss" ] \
            || { echo "::error::targeting-key-flag without a context is not miss"; exit 1; }
          [ "$(tkf "http://$PROXY/api/v1/identities/?identifier=$hit_id")" = "hit" ] \
            || { echo "::error::targeting-key-flag for the targeted identity is not hit"; exit 1; }
          [ "$(tkf "http://$PROXY/api/v1/identities/?identifier=$miss_id")" = "miss" ] \
            || { echo "::error::targeting-key-flag for a non-targeted identity is not miss"; exit 1; }

          value() {
            curl -sf -H "X-Environment-Key: $KEY" \
              "http://$PROXY/api/v1/flags/?feature=changing-flag" | jq -r '.feature_state_value'
          }

          # POST /change must not return until the new value is actually served.
          before=$(value)
          curl -sf -X POST "http://$CONTROL/change" >/dev/null
          after=$(value)
          [ "$before" != "$after" ] || { echo "::error::/change did not change the served value"; exit 1; }

          # POST /start reseeds: the toggle must not survive it. flagd-testbed leaks here.
          curl -sf -X POST "http://$CONTROL/start?config=default" >/dev/null
          [ "$(value)" = "$before" ] || { echo "::error::/start did not reset flag state"; exit 1; }

          # POST /stop makes the backend unreachable without stopping the container.
          curl -sf -X POST "http://$CONTROL/stop" >/dev/null
          curl -sf -m 5 -H "X-Environment-Key: $KEY" "http://$PROXY/api/v1/flags/" >/dev/null 2>&1 \
            && { echo "::error::backend still reachable after /stop"; exit 1; }
          [ "$(docker inspect -f '{{.State.Running}}' smoke)" = "true" ] \
            || { echo "::error::/stop killed the container"; exit 1; }
          curl -sf "http://$CONTROL/healthz" >/dev/null \
            || { echo "::error::control API died with the backend"; exit 1; }

          echo "smoke test passed"
